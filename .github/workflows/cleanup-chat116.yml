name: Stop superseded chat candidates
on:
  push:
    branches: ['ci-chat116-cleanup-20261104']
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Stop verified obsolete build125 tasks, tolerate already-finished races
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,os,time
          root='https://api.github.com/repos/qianshou330-cyber/pubo-ios/actions/runs/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          targets={41858100855:'d458f3dc291efc72b665d17511178da9e830865d',41861154901:'1c3fb41955d2911b32af2dba7155e8f448d82586'}
          for action in ['cancel','force-cancel']:
              for ident,sha in targets.items():
                  url=root+str(ident)
                  run=json.load(urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30))
                  assert run['head_sha']==sha and run['head_branch']=='ci-chat125-intel-20261104'
                  if run['status']=='completed':
                      print('Already finished',ident);continue
                  try:
                      urllib.request.urlopen(urllib.request.Request(url+'/'+action,data=b'',headers=headers,method='POST'),timeout=30).read()
                      print(action,ident,'accepted')
                  except urllib.error.HTTPError as error:
                      if error.code!=409:raise
                      print(action,ident,'state conflict; preserve prior results, continue other obsolete target')
              if action=='cancel':time.sleep(20)
          PY
