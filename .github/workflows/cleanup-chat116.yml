name: Stop superseded chat candidate
on:
  push:
    branches: ['ci-chat116-cleanup-20261104']
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and stop only superseded build 116 runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,os
          root='https://api.github.com/repos/qianshou330-cyber/pubo-ios/actions/runs/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for ident in (41831620740,41831620718):
              url=root+str(ident)
              run=json.load(urllib.request.urlopen(urllib.request.Request(url,headers=headers)))
              assert run['head_sha']=='e11813f32408bf605ae77f43b2cc06be9fa2f178'
              assert run['head_branch']=='ui-chat-alignment-20261104'
              if run['status']!='completed':
                  urllib.request.urlopen(urllib.request.Request(url+'/cancel',data=b'',headers=headers,method='POST')).read()
                  print('Stopped superseded run',ident)
              else: print('Already completed',ident)
          PY
