name: Stop superseded chat candidates
on:
  push:
    branches: ['ci-chat116-cleanup-20261104']
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Stop only verified obsolete runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,os
          root='https://api.github.com/repos/qianshou330-cyber/pubo-ios/actions/runs/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          targets={41833481654:'8189d0334a99030b633a769f3d09bfb61bfbc55b',41836448431:'e7a98ae007875fa6794bfc2dcb30dd6309d8a4ff'}
          for ident,sha in targets.items():
              url=root+str(ident)
              run=json.load(urllib.request.urlopen(urllib.request.Request(url,headers=headers)))
              assert run['head_sha']==sha and run['head_branch']=='ui-chat-alignment-20261104'
              if run['status']!='completed':
                  urllib.request.urlopen(urllib.request.Request(url+'/force-cancel',data=b'',headers=headers,method='POST')).read()
                  print('Stopped obsolete run',ident)
          PY
