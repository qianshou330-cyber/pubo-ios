    - name: Preserve unexpected overflow without masking failure
      uses: actions/upload-artifact@v4
      if: always() && hashFiles('build/evidence-parts/evidence.tar.gz.part-016') != ''
      with:
        name: regression147-overflow-${{ matrix.size }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
        path: build/evidence-parts/
        compression-level: 0
        retention-days: 14
    - name: Preserve raw evidence if archive preparation failed
      uses: actions/upload-artifact@v4
      if: always() && hashFiles('build/evidence-parts/manifest.json') == ''
      with:
        name: regression147-archive-failure-${{ matrix.size }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
        path: 'build/*.xcresult

          build/screenshots/'
        compression-level: 0
        retention-days: 14
    strategy:
      fail-fast: false
      matrix:
        size:
        - large
        - small
    timeout-minutes: 45
