name: PUBO 147 regression gate
'on':
  push:
    branches:
    - ui-regression-147-*
permissions:
  contents: read
jobs:
  regression:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: Prepare fixed tools
      run: 'sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

        brew install xcodegen

        swift scripts/brand-assets.swift

        xcodegen generate

        '
    - name: Check diagnostic isolation and counters
      run: 'swift test --filter RefreshTaskOwnerTests

        sh scripts/test-refresh-diagnostics.sh

        python3 -m unittest discover -s scripts/isolated -p ''test_backend_diagnostics.py'' -v

        python3 -m unittest discover -s scripts -p "test_ui_selection.py" -v'
    - name: Compile before simulator boot
      run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS
        Simulator' -derivedDataPath build/debug CODE_SIGNING_ALLOWED=NO build
    - name: Five targeted regressions with exact-count gate
      env:
        PUBO_SIM_SIZE: ${{ matrix.size }}
        PUBO_REGRESSION_147_ONLY: '1'
      run: python3 scripts/simulator-tests.py
    - name: Prepare lossless raw evidence parts
      if: always()
      run: python3 scripts/split-test-evidence.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: regression147-screens-${{ matrix.size }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
        path: 'build/*.json

          build/screenshots/

          !build/screenshots/**/*.mp4

          build/evidence-parts/manifest.json'
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('build/evidence-parts/evidence.tar.gz.part-000') != ''
      with:
        name: regression147-raw-000-${{ matrix.size }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
        path: build/evidence-parts/evidence.tar.gz.part-000
        compression-level: 0
        retention-days: 14
    - uses: actions/upload-artifact@v4
