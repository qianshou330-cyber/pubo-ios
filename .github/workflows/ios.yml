name: iPhone native validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Record build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          xcodebuild -version
          swift --version
          brew install xcodegen
          xcodegen --version
      - name: Core unit tests
        run: |
          swift test
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Generate project
        run: |
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Build and test two iPhone sizes
        run: python3 scripts/simulator-tests.py
      - name: Release simulator build
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/release CODE_SIGNING_ALLOWED=NO build
      - name: Verify release metadata
        run: |
          python3 - <<'PY'
          import json, pathlib, plistlib
          app = pathlib.Path('build/release/Build/Products/Release-iphonesimulator/PUBO.app')
          data = plistlib.loads((app / 'Info.plist').read_bytes())
          expected = {'CFBundleIdentifier': 'com.bolubo.native', 'CFBundleShortVersionString': '0.2.0', 'CFBundleVersion': '18', 'MinimumOSVersion': '17.0', 'UIDeviceFamily': [1], 'CFBundleSupportedPlatforms': ['iPhoneSimulator']}
          for key, value in expected.items():
              assert data.get(key) == value, (key, data.get(key), value)
          assert (app / 'PUBO').is_file()
          pathlib.Path('build/release-metadata.json').write_text(json.dumps({'status': 'PASS', 'values': expected}, indent=2))
          PY
      - name: Release iPhone device build (unsigned)
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
      - name: Verify and package unsigned device IPA
        run: python3 scripts/package-device.py
      - name: Upload unsigned device IPA
        id: device_upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pubo-iphone-unsigned-${{ github.sha }}
          path: |
            build/unsigned/*.ipa
            build/device-package.json
          if-no-files-found: error
          retention-days: 7
      - name: Retry device artifact transfer if service failed
        if: steps.device_upload.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pubo-iphone-unsigned-retry-${{ github.sha }}
          path: |
            build/unsigned/*.ipa
            build/device-package.json
          if-no-files-found: error
          retention-days: 7
      - name: Collect evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-${{ github.sha }}
          path: |
            build/*.json
            build/*.xcresult
            build/screenshots/
            build/release/Build/Products/Release-iphonesimulator/PUBO.app
          retention-days: 7
