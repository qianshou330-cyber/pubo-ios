name: PUBO four-tab candidate
'on':
  push:
    branches: ['ui-four-tabs-*']
permissions:
  contents: read
concurrency:
  group: four-tabs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # Standard Intel pool avoids the arm64 capacity outage; Xcode and gates stay pinned.
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pin Xcode and run all core and script checks
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          set -o pipefail
          mkdir -p build
          swift test 2>&1 | tee build/core-tests.log
          python3 -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee build/script-tests.log
      - name: Preserve exact revision
        if: always()
        run: |
          mkdir -p build
          git rev-parse HEAD > build/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-tabs-core-${{ github.sha }}
          path: |
            build/source-sha.txt
            build/core-tests.log
            build/script-tests.log
  navigation:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
    runs-on: macos-15-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Compile Debug app and UI test bundle before starting device
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/debug CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES build-for-testing
      - name: Four-tab synthetic UI and real simulator screenshots
        env:
          PUBO_SIM_SIZE: ${{ matrix.size }}
        run: python3 scripts/four-tabs-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-tabs-evidence-${{ matrix.size }}-${{ github.sha }}
          path: |
            build/four-tabs*.json
            build/four-tabs.xcresult
            build/screenshots/
          retention-days: 14
          if-no-files-found: error
  package:
    needs: [checks, navigation]
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Release simulator compile
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/release CODE_SIGNING_ALLOWED=NO build
      - name: Real iPhoneOS arm64 unsigned package, never a renamed simulator app
        run: |
          xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          python3 scripts/package-device.py
          git rev-parse HEAD > build/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-tabs-iphone-unsigned-${{ github.sha }}
          path: |
            build/unsigned/
            build/device-package.json
            build/source-sha.txt
          retention-days: 14
          if-no-files-found: error
