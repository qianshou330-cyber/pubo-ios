name: PUBO four-tab candidate
'on':
  push:
    branches: ['ui-four-tabs-*']
permissions:
  contents: read
concurrency:
  group: four-tabs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # Standard Intel pool avoids the arm64 capacity outage; Xcode and gates stay pinned.
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pin Xcode and run all core and script checks
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          set -o pipefail
          mkdir -p build
          swift test 2>&1 | tee build/core-tests.log
          python3 -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee build/script-tests.log
          sh scripts/test-refresh-diagnostics.sh 2>&1 | tee build/refresh-diagnostic-tests.log
          node --test scripts/isolated/test-room-message-proof.mjs 2>&1 | tee build/room-receipt-tests.log
      - name: Preserve exact revision
        if: always()
        run: |
          mkdir -p build
          git rev-parse HEAD > build/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-tabs-core-${{ github.sha }}
          path: |
            build/source-sha.txt
            build/core-tests.log
            build/script-tests.log
            build/refresh-diagnostic-tests.log
            build/room-receipt-tests.log
  ocr-validation:
    needs: checks
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pinned OCR identity and all 189 controls, no relaxed expected results
        run: |
          brew install tesseract
          python3 scripts/setup-badge-ocr.py
          python3 scripts/check-badge-ocr-corpus.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-tabs-ocr-validation-${{ github.sha }}
          path: build/badge-ocr-*.json
          retention-days: 14
          if-no-files-found: error
  navigation:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
    runs-on: macos-15-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen tesseract
          python3 scripts/setup-badge-ocr.py
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Compile Debug app and UI test bundle before starting device
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/debug CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES build-for-testing
      - name: Four-tab synthetic UI and real simulator screenshots
        env:
          PUBO_SIM_SIZE: ${{ matrix.size }}
        run: python3 scripts/four-tabs-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-tabs-evidence-${{ matrix.size }}-${{ github.sha }}
          path: |
            build/four-tabs*.json
            build/badge-ocr-setup.json
            build/four-tabs.xcresult
            build/screenshots/
          retention-days: 14
          if-no-files-found: error
  legacy-regression:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
    runs-on: macos-15-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Compile Debug app and all UI test sources
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/debug CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES build-for-testing
      - name: Preserve five previous regressions and strict same-process resume proof
        env:
          PUBO_SIM_SIZE: ${{ matrix.size }}
          PUBO_REGRESSION_147_ONLY: '1'
          PUBO_PREBUILT_TESTS: '1'
        run: python3 scripts/simulator-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-tabs-legacy-five-${{ matrix.size }}-${{ github.sha }}
          path: |
            build/*.json
            build/ui-*.xcresult
            build/screenshots/
          retention-days: 14
          if-no-files-found: error
  package:
    needs: [checks, ocr-validation, navigation, legacy-regression]
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Release simulator compile
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/release CODE_SIGNING_ALLOWED=NO build
      - name: Real iPhoneOS arm64 unsigned package, never a renamed simulator app
        run: |
          xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          python3 scripts/package-device.py
          git rev-parse HEAD > build/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-tabs-iphone-unsigned-${{ github.sha }}
          path: |
            build/unsigned/
            build/device-package.json
            build/source-sha.txt
          retention-days: 14
          if-no-files-found: error

  candidate-package:
    # Requested trial build, explicitly not the all-gates-passed artifact above.
    # Core checks and actual Release/device packaging must still succeed.
    needs: checks
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Release simulator compile
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/release CODE_SIGNING_ALLOWED=NO build
      - name: Real iPhoneOS arm64 unsigned package, never a renamed simulator app
        run: |
          xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          python3 scripts/package-device.py
          git rev-parse HEAD > build/source-sha.txt
      - name: Label trial package as QA incomplete, never a validation pass
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          package = json.loads(Path('build/device-package.json').read_text())
          assert package['status'] == 'PASS' and package['commit'] == os.environ['GITHUB_SHA']
          report = {
              'artifactKind': 'UNSIGNED_TRIAL_CANDIDATE',
              'overallQA': 'INCOMPLETE',
              'sourceCommit': os.environ['GITHUB_SHA'],
              'workflowRun': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'packageValidation': 'PASS',
              'coreChecks': 'PASS',
              'requiresSigningBeforeInstallation': True,
              'notCertifiedByThisArtifact': ['OCR corpus gate', 'current iOS UI and three-phase pixel gates', 'full legacy regression', 'real camera', 'APNs', 'minimum iOS17', 'signed install and upgrade'],
              'knownPriorBlocker': 'C10 Mac OCR corpus rejected three correct-text controls below the unchanged confidence80 threshold; do not call this all-QA-passed.',
          }
          Path('build/candidate-status.json').write_text(json.dumps(report, indent=2) + '\n')
          Path('build/CANDIDATE-NOT-FULLY-VERIFIED.txt').write_text('Unsigned trial candidate. Package structure and core checks passed. This is NOT an all-QA-passed release. See candidate-status.json and the workflow results. Requires your own signing before installation. Real device camera, APNs, signed installation and upgrade have NOT been verified.\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: four-tabs-candidate-QA-INCOMPLETE-${{ github.sha }}
          path: |
            build/unsigned/
            build/device-package.json
            build/candidate-status.json
            build/CANDIDATE-NOT-FULLY-VERIFIED.txt
            build/source-sha.txt
          retention-days: 14
          if-no-files-found: error
