name: PUBO four-tab candidate
'on':
  push:
    branches: ['ui-four-tabs-*']
permissions:
  contents: read
concurrency:
  group: four-tabs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # Standard Intel pool avoids the arm64 capacity outage; Xcode and gates stay pinned.
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pin Xcode and run all core and script checks
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          set -o pipefail
          mkdir -p build
          swift test 2>&1 | tee build/core-tests.log
          python3 -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee build/script-tests.log
          python3 scripts/check-chat-bubble-geometry.py 2>&1 | tee build/chat-bubble-geometry.log
          sh scripts/test-refresh-diagnostics.sh 2>&1 | tee build/refresh-diagnostic-tests.log
          node --test scripts/isolated/test-room-message-proof.mjs 2>&1 | tee build/room-receipt-tests.log
      - name: Darwin gate host preflight (not Simulator proof)
        run: |
          set -o pipefail
          mkdir -p build
          bash scripts/check_chat_gate_macos.sh 2>&1 | tee build/chat-gate-preflight.log
      - name: Preserve exact revision
        if: always()
        run: |
          mkdir -p build
          git rev-parse HEAD > build/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-tabs-core-${{ github.sha }}
          path: |
            build/source-sha.txt
            build/chat-bubble-geometry.log
            build/core-tests.log
            build/script-tests.log
            build/refresh-diagnostic-tests.log
            build/room-receipt-tests.log
            build/chat-gate-preflight.log
  ocr-validation:
    needs: checks
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pinned OCR identity and all 189 controls, no relaxed expected results
        run: |
          brew install tesseract
          python3 scripts/setup-badge-ocr.py
          python3 scripts/check-badge-ocr-corpus.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-tabs-ocr-validation-${{ github.sha }}
          path: build/badge-ocr-*.json
          retention-days: 14
          if-no-files-found: error
  navigation:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
        shard: [routing, interaction]
    runs-on: macos-15-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen tesseract
          python3 scripts/setup-badge-ocr.py
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Compile Debug app and UI test bundle before starting device
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/debug CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES build-for-testing
      - name: Four-tab synthetic UI and real simulator screenshots
        env:
          PUBO_SIM_SIZE: ${{ matrix.size }}
          PUBO_NAV_SHARD: ${{ matrix.shard }}
        run: python3 scripts/four-tabs-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-tabs-evidence-${{ matrix.size }}-${{ matrix.shard }}-${{ github.sha }}-a${{ github.run_attempt }}
          path: |
            build/four-tabs*.json
            build/badge-ocr-setup.json
            build/four-tabs.xcresult
            build/screenshots/
          retention-days: 14
          if-no-files-found: error
  navigation-evidence:
    # A complete result requires all four shards from this exact workflow attempt.
    needs: navigation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: four-tabs-evidence-*-${{ github.sha }}-a${{ github.run_attempt }}
          path: build/navigation-shards
          merge-multiple: false
      - name: Verify every case and badge receipt for both sizes
        run: python3 scripts/verify_navigation_shards.py build/navigation-shards
  legacy-regression:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
    runs-on: macos-15-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Compile Debug app and all UI test sources
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/debug CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES build-for-testing
      - name: Preserve five previous regressions and strict same-process resume proof
        env:
          PUBO_SIM_SIZE: ${{ matrix.size }}
          PUBO_REGRESSION_147_ONLY: '1'
          PUBO_PREBUILT_TESTS: '1'
        run: python3 scripts/simulator-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-tabs-legacy-five-${{ matrix.size }}-${{ github.sha }}
          path: |
            build/*.json
            build/ui-*.xcresult
            build/screenshots/
          retention-days: 14
          if-no-files-found: error
  chat-alignment:
    # All ten methods in required disjoint 5+5 jobs per size; unchanged assertions/budget.
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
        part: [layout, actions]
    runs-on: macos-15-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Compile Debug app and all UI test sources
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/debug CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES build-for-testing
      - name: Five chat-alignment methods per required half, strict count and 30-minute budget
        env:
          PUBO_SIM_SIZE: ${{ matrix.size }}
          PUBO_UI_SHARD: 'chat-alignment-${{ matrix.part }}'
          PUBO_PREBUILT_TESTS: '1'
        run: |
          set -o pipefail
          python3 scripts/simulator-tests.py 2>&1 | tee build/chat-alignment-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-tabs-chat-alignment-${{ matrix.size }}-${{ matrix.part }}-${{ github.sha }}
          path: |
            build/*.json
            build/chat-alignment-tests.log
            build/ui-*.xcresult
            build/screenshots/
          retention-days: 14
          if-no-files-found: error
  messages-redesign:
    # Existing Xcode/runner and exact standard/Pro Max profiles; no device build or external reference.
    if: github.event_name == 'push' && github.repository == 'qianshou330-cyber/pubo-ios' && github.ref == 'refs/heads/ui-four-tabs-148-20261112' && github.event.deleted == false
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
    runs-on: macos-15-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source and provision existing Simulator tools
        run: |
          set -euo pipefail
          mkdir -p build/messages-redesign
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f UITests/MessagesRedesignUITests.swift
          git rev-parse HEAD > build/messages-redesign/source-sha.txt
          git hash-object UITests/MessagesRedesignUITests.swift > build/messages-redesign/suite-blob.txt
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > build/messages-redesign/run-attempt.txt
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          xcodebuild -version | tee build/messages-redesign/xcode-version.txt
          grep -Fx 'Xcode 26.0.1' build/messages-redesign/xcode-version.txt
          grep -Fx 'Build version 17A400' build/messages-redesign/xcode-version.txt
          test "$(uname -m)" = x86_64
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          XCODEGEN="$(brew --prefix xcodegen)/bin/xcodegen"
          test -x "$XCODEGEN"
          "$XCODEGEN" --version | tee build/messages-redesign/xcodegen-version.txt
          brew list --versions xcodegen > build/messages-redesign/xcodegen-brew-package.txt
          swift scripts/brand-assets.swift
          "$XCODEGEN" generate
      - name: Build unsigned Debug Simulator test bundle only
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/debug CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES build-for-testing
      - name: Run only four dedicated synthetic Messages tests and validate real evidence
        env:
          PUBO_SIM_SIZE: ${{ matrix.size }}
          PUBO_UI_SHARD: messages-redesign
          PUBO_PREBUILT_TESTS: '1'
        run: |
          set -euo pipefail
          if python3 scripts/simulator-tests.py 2>&1 | tee build/messages-redesign/test.log &&
             python3 scripts/verify_messages_redesign_evidence.py --build build --size "$PUBO_SIM_SIZE"; then
            exit 0
          fi
          python3 scripts/verify_messages_redesign_evidence.py --build build --size "$PUBO_SIM_SIZE" --partial || true
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: messages-redesign-simulator-${{ matrix.size }}-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            build/messages-redesign/source-sha.txt
            build/messages-redesign/suite-blob.txt
            build/messages-redesign/run-attempt.txt
            build/messages-redesign/xcode-version.txt
            build/messages-redesign/xcodegen-version.txt
            build/messages-redesign/xcodegen-brew-package.txt
            build/messages-redesign/evidence.json
            build/messages-redesign/partial-evidence.json
            build/messages-redesign/method-tree-rejection.json
            build/messages-redesign/partial-originals/*.png
            build/messages-redesign/originals/*.png
          retention-days: 14
          if-no-files-found: error
  chat-presentation:
    # Required disjoint 4+4 methods per size; original eight and 30-minute budget stay intact.
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
        part: [composer, states]
    runs-on: macos-15-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Compile Debug app and all UI test sources
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/debug CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES build-for-testing
      - name: Four chat presentation methods in one required half, strict count and 30-minute budget
        env:
          PUBO_SIM_SIZE: ${{ matrix.size }}
          PUBO_UI_SHARD: 'chat-presentation-${{ matrix.part }}'
          PUBO_PREBUILT_TESTS: '1'
        run: |
          set -o pipefail
          python3 scripts/simulator-tests.py 2>&1 | tee build/chat-presentation-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-tabs-chat-presentation-${{ matrix.size }}-${{ matrix.part }}-${{ github.sha }}
          path: |
            build/*.json
            build/chat-presentation-tests.log
            build/ui-*.xcresult
            build/screenshots/
          retention-days: 14
          if-no-files-found: error
  diagnostic-private-back:
    # Separate Max runs, not a replacement for the required composer gate.
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        scenario: [without-picker, after-picker]
    runs-on: macos-15-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare fixed build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Compile Debug app and all UI test sources
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/debug CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES build-for-testing
      - name: Run one dark private-chat double-Back control on a fresh Max simulator
        env:
          PUBO_SIM_SIZE: large
          PUBO_UI_SHARD: 'private-back-${{ matrix.scenario }}'
          PUBO_PREBUILT_TESTS: '1'
        run: |
          set -o pipefail
          python3 scripts/simulator-tests.py 2>&1 | tee build/private-back-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-private-back-${{ matrix.scenario }}-${{ github.sha }}
          path: |
            build/*.json
            build/private-back-tests.log
            build/ui-*.xcresult
            build/screenshots/
          retention-days: 14
          if-no-files-found: error
  diagnostic-room-back:
    # Separate SE room/light runs, not a replacement for the required composer gate.
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        scenario: [without-picker, after-picker]
    runs-on: macos-15-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare fixed build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Compile Debug app and all UI test sources
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/debug CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES build-for-testing
      - name: Run one light room-chat double-Back control on the fresh standard-size QA simulator
        env:
          PUBO_SIM_SIZE: small
          PUBO_UI_SHARD: 'room-back-${{ matrix.scenario }}'
          PUBO_PREBUILT_TESTS: '1'
        run: |
          set -o pipefail
          python3 scripts/simulator-tests.py 2>&1 | tee build/room-back-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-room-back-${{ matrix.scenario }}-${{ github.sha }}
          path: |
            build/*.json
            build/room-back-tests.log
            build/ui-*.xcresult
            build/screenshots/
          retention-days: 14
          if-no-files-found: error
  diagnostic-world-scroll:
    # Separate simulator scrolling diagnostics, not a replacement for the required composer gate.
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        scenario: [cross-page, signposts]
        size: [small, large]
    runs-on: macos-15-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare fixed build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Compile Debug app and all UI test sources
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/debug CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES build-for-testing
      - name: Run one synthetic World scroll diagnostic on a fresh simulator
        env:
          PUBO_SIM_SIZE: ${{ matrix.size }}
          PUBO_UI_SHARD: 'world-scroll-${{ matrix.scenario }}'
          PUBO_PREBUILT_TESTS: '1'
        run: |
          set -o pipefail
          python3 scripts/simulator-tests.py 2>&1 | tee build/world-scroll-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-world-scroll-${{ matrix.size }}-${{ matrix.scenario }}-${{ github.sha }}
          path: |
            build/*.json
            build/world-scroll-tests.log
            build/ui-*.xcresult
            build/screenshots/
          retention-days: 14
          if-no-files-found: error
  video-poster:
    # Four real decoder/thumbnail cases on both sizes; independent of OCR outcome.
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
    runs-on: macos-15-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Compile Debug app and all UI test sources
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/debug CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES build-for-testing
      - name: Four real video-poster tests with existing strict count gate and 30-minute test budget
        env:
          PUBO_SIM_SIZE: ${{ matrix.size }}
          PUBO_UI_SHARD: 'video-poster'
          PUBO_PREBUILT_TESTS: '1'
        run: |
          set -o pipefail
          python3 scripts/simulator-tests.py 2>&1 | tee build/video-poster-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-tabs-video-poster-${{ matrix.size }}-${{ github.sha }}
          path: |
            build/*.json
            build/video-poster-tests.log
            build/ui-*.xcresult
            build/screenshots/
          retention-days: 14
          if-no-files-found: error
  h5-chat-reference:
    # Real H5 bundles, synthetic ChatParity data, no production API writes.
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser harness
        working-directory: scripts/h5-chat
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Capture actual H5 at the standard and large simulator profiles in both themes
        working-directory: scripts/h5-chat
        run: npm run capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-tabs-h5-chat-${{ github.sha }}
          path: |
            scripts/h5-chat/artifacts/
            docs/chat-h5-source-manifest.json
          retention-days: 14
          if-no-files-found: error
  package:
    needs: [checks, ocr-validation, navigation, navigation-evidence, legacy-regression, chat-alignment, chat-presentation, h5-chat-reference, video-poster]
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Release simulator compile
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/release CODE_SIGNING_ALLOWED=NO build
      - name: Real iPhoneOS arm64 unsigned package, never a renamed simulator app
        run: |
          xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          python3 scripts/package-device.py
          git rev-parse HEAD > build/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-tabs-iphone-unsigned-${{ github.sha }}
          path: |
            build/unsigned/
            build/device-package.json
            build/source-sha.txt
          retention-days: 14
          if-no-files-found: error

  candidate-package:
    # Requested trial build, explicitly not the all-gates-passed artifact above.
    # Core checks and actual Release/device packaging must still succeed.
    needs: checks
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Release simulator compile
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/release CODE_SIGNING_ALLOWED=NO build
      - name: Real iPhoneOS arm64 unsigned package, never a renamed simulator app
        run: |
          xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          python3 scripts/package-device.py
          git rev-parse HEAD > build/source-sha.txt
      - name: Label trial package as QA incomplete, never a validation pass
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          package = json.loads(Path('build/device-package.json').read_text())
          assert package['status'] == 'PASS' and package['commit'] == os.environ['GITHUB_SHA']
          report = {
              'artifactKind': 'UNSIGNED_TRIAL_CANDIDATE',
              'overallQA': 'INCOMPLETE',
              'sourceCommit': os.environ['GITHUB_SHA'],
              'workflowRun': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'packageValidation': 'PASS',
              'coreChecks': 'PASS',
              'requiresSigningBeforeInstallation': True,
              'notCertifiedByThisArtifact': ['OCR corpus gate', 'current iOS UI and three-phase pixel gates', 'full legacy regression', 'real camera', 'APNs', 'minimum iOS17', 'signed install and upgrade'],
              'knownPriorBlocker': 'C10 Mac OCR corpus rejected three correct-text controls below the unchanged confidence80 threshold; do not call this all-QA-passed.',
          }
          Path('build/candidate-status.json').write_text(json.dumps(report, indent=2) + '\n')
          Path('build/CANDIDATE-NOT-FULLY-VERIFIED.txt').write_text('Unsigned trial candidate. Package structure and core checks passed. This is NOT an all-QA-passed release. See candidate-status.json and the workflow results. Requires your own signing before installation. Real device camera, APNs, signed installation and upgrade have NOT been verified.\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: four-tabs-candidate-QA-INCOMPLETE-${{ github.sha }}
          path: |
            build/unsigned/
            build/device-package.json
            build/candidate-status.json
            build/CANDIDATE-NOT-FULLY-VERIFIED.txt
            build/source-sha.txt
          retention-days: 14
          if-no-files-found: error
  diagnostic-world-page2-poster:
    # Independently opted in by the test branch's head commit; not a package/QA gate.
    if: github.event_name == 'push' && github.ref == 'refs/heads/ui-four-tabs-148-20261112' && contains(github.event.head_commit.message, '[world-page2-probe]')
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
