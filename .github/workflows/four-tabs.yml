          import json, os, pathlib, platform, subprocess
          keys = ('GITHUB_REPOSITORY', 'GITHUB_SHA', 'GITHUB_REF', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB')
          record = {key: os.environ.get(key) for key in keys}
          record.update(checkoutSHA=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), host=platform.platform(), architecture=platform.machine(), scope='HOST_ONLY_NOT_IPHONE_HITCHES')
