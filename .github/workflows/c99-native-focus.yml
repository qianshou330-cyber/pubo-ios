name: C99 stock simulator environment focus
'on':
  push:
    branches: [diag-c99-native-focus]
permissions:
  contents: read
jobs:
  focus:
    if: github.event_name == 'push' && github.repository == 'qianshou330-cyber/pubo-ios' && github.ref == 'refs/heads/diag-c99-native-focus' && github.event.deleted == false && github.event.before == '6f6cc46679278da37e99bd9c47e3314e3075b02d' && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: small
            area: world
          - size: small
            area: friends
          - size: large
            area: friends
    name: C99 ${{ matrix.area }} / ${{ matrix.size }} / stock env
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Align Xcode selection and run strict C99 focus
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          test "$(git hash-object diagnostics/c99/focus.py)" = "c110b82d6950830729927106df3206d76811a6ae"
          python3 -B diagnostics/c99/focus.py "${{ matrix.size }}" "${{ matrix.area }}" >/dev/null 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: "!cancelled() && steps.probe.outputs.ready == 'true'"
        with:
          name: c99-${{ matrix.area }}-${{ matrix.size }}-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c99-publish/state.json
            ${{ runner.temp }}/c99-publish/original-*.png
          retention-days: 7
          if-no-files-found: error
