name: C99 single shared build diagnostic
'on':
  push:
    branches: [diag-c99-native-focus]
permissions:
  contents: read
jobs:
  shared-build-only:
    if: github.event_name == 'push' && github.repository == 'qianshou330-cyber/pubo-ios' && github.ref == 'refs/heads/diag-c99-native-focus' && github.event.deleted == false && github.event.before == '91e90c887039967594646879c6513ea16544acce'
    name: C99 shared Debug build only (no UI tests)
    runs-on: macos-15-intel
    timeout-minutes: 33
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Run one unsigned build and classify privately
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git hash-object diagnostics/c99/build_probe.py)" = "924b9befb288da3c3818b5b31ba152f89ebba846"
          python3 -I -B diagnostics/c99/build_probe.py >/dev/null 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: "!cancelled() && steps.probe.outputs.ready == 'true'"
        with:
          name: c99-build-only-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/c99-build-only/state.json
          retention-days: 7
          if-no-files-found: error
