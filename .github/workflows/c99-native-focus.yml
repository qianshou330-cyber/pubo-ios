name: C99 single Friends stock invocation
'on':
  push:
    branches: [diag-c99-native-focus]
permissions:
  contents: read
jobs:
  focus:
    if: github.event_name == 'push' && github.repository == 'qianshou330-cyber/pubo-ios' && github.ref == 'refs/heads/diag-c99-native-focus' && github.event.deleted == false && github.event.before == 'a0954a837af3a5e68149b1cad65efa610f6740a6' && github.run_attempt == 1
    name: C99 Friends / iPhone 17 / stock invocation
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Run the exact Friends methods with stock prebuilt settings
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git hash-object diagnostics/c99/focus.py)" = "9a36465ea03c613646aa4319b9b7bbd71870067a"
          python3 -B diagnostics/c99/focus.py small friends >/dev/null 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: "!cancelled() && steps.probe.outputs.ready == 'true'"
        with:
          name: c99-friends-stock-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c99-publish/state.json
            ${{ runner.temp }}/c99-publish/original-*.png
          retention-days: 7
          if-no-files-found: error
