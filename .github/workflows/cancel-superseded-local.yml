name: Cancel superseded PUBO iOS candidate checks
on:
  push:
    branches: ['ci-cleanup-local-20261104']
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const candidates = [
              [41777323519, 'ui-local-timeline-20261104-build96', '8daed5f2591958cea97214bc159507554633507c'],
              [41777323496, 'ui-local-timeline-20261104-build96', '8daed5f2591958cea97214bc159507554633507c'],
              [41778141756, 'ui-local-timeline-20261104-build97', '4ee114a8d4da09b415ba316111885f47b369781e'],
              [41778141738, 'ui-local-timeline-20261104-build97', '4ee114a8d4da09b415ba316111885f47b369781e'],
              [41778659132, 'ui-local-timeline-20261104-build98', '90ac055f9b6ace0d2f409cda27c5fadbedb3853e'],
              [41778659195, 'ui-local-timeline-20261104-build98', '90ac055f9b6ace0d2f409cda27c5fadbedb3853e']
            ];
            for (const [run_id, branch, sha] of candidates) {
              const {data:run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
              if (run.head_branch !== branch || run.head_sha !== sha || run.head_branch === 'main') throw new Error('Candidate identity mismatch');
              if (['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(run.status)) {
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {...context.repo, run_id});
                core.info('Cancelled superseded candidate run ' + run_id);
              } else core.info('Already finished ' + run_id);
            }
