name: Build104 corrected selector validation
on:
  push:
    branches: ['ci-local104-validation-20261104']
permissions:
  contents: read
jobs:
  appearance:
    strategy:
      fail-fast: false
      matrix:
        size: [large, small]
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 71bae67472f11e3afc3a66522b4f5950f28c85a7
      - name: Record exact unchanged application source
        run: |
          mkdir -p build
          git rev-parse HEAD > build/checked-out-source.txt
          git diff --exit-code d0068018211cd1ba5ac8d6a9b5bccff2d03093e7 -- App Sources project.yml Package.swift

      - name: Prepare and compile UI test app
        id: compile
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen
          swift scripts/brand-assets.swift
          xcodegen generate
          xcodebuild -quiet -project PUBO.xcodeproj -scheme PUBO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/debug CODE_SIGNING_ALLOWED=NO build
      - name: Timeline interactions
        if: always() && !cancelled() && steps.compile.outcome == 'success'
        env:
          PUBO_SIM_SIZE: ${{ matrix.size }}
          PUBO_UI_GROUPS: timeline
          PUBO_UI_SCOPE: timeline
        run: python3 scripts/local-timeline-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timeline-first-evidence-${{ matrix.size }}-${{ github.sha }}
          path: |
            build/checked-out-source.txt
            build/warmup-timeline.png
            build/timeline*.json
            build/timeline.xcresult/
            build/screenshots/timeline/
          retention-days: 14

  joint:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: '1'
      NODE_ENV: test
      MK_NO_DAEMONS: '1'
      PUBO_KPOP_CHARTS_ENABLED: 'false'
      PUBO_MUSIC_CHARTS_ENABLED: 'false'
      PUBO_SNAKE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 71bae67472f11e3afc3a66522b4f5950f28c85a7
      - name: Select only unresolved reaction cancellation test
        run: |
          mkdir -p build
          git rev-parse HEAD > build/integration-checked-out-source.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/isolated/native-ui.py')
          p.write_text(p.read_text().replace('-only-testing:PUBOUITests/PUBOIntegrationTests','-only-testing:PUBOUITests/PUBOIntegrationTests/testRealLocalTimelineReactionAndCancellation').replace("summary.get('passedTests',0)==16","summary.get('passedTests',0)==1").replace('All sixteen real-backend UI tests','The reaction cancellation test'))
          PY
          git diff --exit-code d0068018211cd1ba5ac8d6a9b5bccff2d03093e7 -- App Sources project.yml Package.swift

      - uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
      - name: Prepare disposable local tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen postgresql@18 redis
          npm install --global pnpm@11.25.0
          mkdir -p build "$RUNNER_TEMP/pubo-pg" "$RUNNER_TEMP/pubo-redis"
          PGBIN="$(brew --prefix postgresql@18)/bin"
          "$PGBIN/initdb" -D "$RUNNER_TEMP/pubo-pg" --auth=trust --encoding=UTF8
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pubo-pg" -l "$RUNNER_TEMP/pubo-pg.log" -o '-h 127.0.0.1 -p 54312' -w start
          "$PGBIN/createdb" -h 127.0.0.1 -p 54312 pubo_native_integration
          redis-server --bind 127.0.0.1 --port 56312 --save '' --appendonly no --daemonize yes --pidfile "$RUNNER_TEMP/pubo-redis.pid" --logfile "$RUNNER_TEMP/pubo-redis.log" --dir "$RUNNER_TEMP/pubo-redis"
      - name: Compile native app before backend setup
        run: |
          swift scripts/brand-assets.swift
          xcodegen generate
          xcodebuild -quiet -project PUBO.xcodeproj -scheme PUBO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/integration-derived CODE_SIGNING_ALLOWED=NO build
      - name: Build exact isolated backend
        run: python3 scripts/isolated/prepare-backend.py
      - name: Start loopback-only backend and synthetic accounts
        run: |
          node scripts/isolated/start-backend.mjs > "$RUNNER_TEMP/pubo-native-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pubo-native-backend.pid"
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(90):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:61913/context', timeout=2) as response:
                      assert response.status == 200
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Isolated backend did not become ready; no production fallback')
          PY
      - name: Native UI against real isolated APIs
        run: |
          swift scripts/brand-assets.swift
          xcodegen generate
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity dict' App/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true' App/Info.plist
          python3 scripts/isolated/native-ui.py
      - name: Stop task-owned local services
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,signal
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          for name in ['pubo-native-backend.pid','pubo-redis.pid']:
              path=root/name
              if path.exists():
                  try: os.kill(int(path.read_text()),signal.SIGTERM)
                  except ProcessLookupError: pass
          PY
          PGBIN="$(brew --prefix postgresql@18)"
          if [ -f "$RUNNER_TEMP/pubo-pg/postmaster.pid" ]; then "$PGBIN/bin/pg_ctl" -D "$RUNNER_TEMP/pubo-pg" -m fast -w stop; fi
      - name: Collect safe integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-backend-integration-${{ github.sha }}
          path: |
            build/integration-checked-out-source.txt
            build/integration-*.json
            build/integration-ui.xcresult
            build/integration-screenshots/
          retention-days: 7

