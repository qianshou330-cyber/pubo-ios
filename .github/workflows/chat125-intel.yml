name: PUBO build128 evidence recovery
on:
  push:
    branches: ['ci-chat125-intel-20261104']
permissions:
  contents: read
  actions: read
concurrency:
  group: chat128-evidence-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 13351502895
          run-id: 41875957393
          github-token: ${{ github.token }}
          path: evidence
          merge-multiple: true
      - name: Print exact test summaries
        run: |
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('evidence')
          for f in sorted(p.glob('*summary.json')):
              j=json.loads(f.read_text())
              print(f.name,json.dumps({k:j.get(k) for k in ('passedTests','totalTestCount','failedTests','skippedTests','testFailures')},ensure_ascii=False))
          print('top', [str(f.relative_to(p)) for f in p.iterdir()])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovered128-large-metadata
          path: evidence/*.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: recovered128-large-chat
          path: evidence/screenshots/chat/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: recovered128-large-gif
          path: evidence/screenshots/gif/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: recovered128-large-favorites
          path: evidence/screenshots/favorites/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: recovered128-large-social
          path: evidence/screenshots/social/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: recovered128-large-regression
          path: evidence/screenshots/regression/
          retention-days: 14
