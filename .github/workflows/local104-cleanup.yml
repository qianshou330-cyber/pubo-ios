name: Release superseded build104 regression slots
on:
  push:
    branches: ['ci-cleanup-local104-20261104']
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source and cancel only superseded build104 runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          targets=[(41783341037,'ui-local-timeline-20261104-build104','d0068018211cd1ba5ac8d6a9b5bccff2d03093e7'),(41784447750,'ci-local104-small-retry-20261104','971c3b23ae2fbcb94c7544b275271c96b1e1e7fc')]
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          for run,branch,sha in targets:
              url=f'https://api.github.com/repos/qianshou330-cyber/pubo-ios/actions/runs/{run}'
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as response:value=json.load(response)
              assert value['head_branch']==branch and value['head_sha']==sha
              if value['status']=='completed':print(run,'already completed',value['conclusion']);continue
              with urllib.request.urlopen(urllib.request.Request(url+'/cancel',data=b'',headers=headers,method='POST')) as response:print(run,'cancel requested',response.status)
          PY
