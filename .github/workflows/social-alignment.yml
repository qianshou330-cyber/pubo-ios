name: PUBO social alignment
on:
  push:
    branches: ['ui-social-parity-*']
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed tools and core checks
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen
          swift test
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Release simulator
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/release CODE_SIGNING_ALLOWED=NO build
      - name: Release device
        run: |
          xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          python3 scripts/package-device.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-device-${{ github.sha }}
          path: |
            build/unsigned/
            build/device-package.json
          retention-days: 14
  appearance:
    strategy:
      fail-fast: false
      matrix:
        size: [large, small]
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          brew install xcodegen
          swift scripts/brand-assets.swift
          xcodegen generate
      - name: Compile before simulator boot
        run: xcodebuild -project PUBO.xcodeproj -scheme PUBO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/debug CODE_SIGNING_ALLOWED=NO build
      - name: Social interactions and existing regressions
        env:
          PUBO_SIM_SIZE: ${{ matrix.size }}
          PUBO_SOCIAL_ALIGNMENT: '1'
          PUBO_AUTH_VIDEO: '1'
        run: python3 scripts/simulator-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-evidence-${{ matrix.size }}-${{ github.sha }}
          path: |
            build/*.json
            build/*.xcresult
            build/screenshots/
          retention-days: 14
  visual-reference:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated H5 visual tooling
        working-directory: scripts/h5-capture
        run: |
          npm ci
          # Matching official image already contains Chromium and OS libraries.
          npx playwright --version
      - name: Capture actual H5 with synthetic data only
        working-directory: scripts/h5-capture
        env:
          FIXTURE_PATH: ../../App/Resources/TimelineParity.json
        run: npm run capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h5-visual-reference-${{ github.sha }}
          path: scripts/h5-capture/artifacts/
          if-no-files-found: error
          retention-days: 14
  visual-multipage:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated multipage reference tooling
        working-directory: scripts/h5-multipage
        run: npm ci
      - name: Capture real H5 routes with synthetic read APIs
        working-directory: scripts/h5-multipage
        env:
          FIXTURE_PATH: ../../App/Resources/TimelineParity.json
        run: npm run capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h5-multipage-reference-${{ github.sha }}
          path: scripts/h5-multipage/artifacts/
          if-no-files-found: error
          retention-days: 14
