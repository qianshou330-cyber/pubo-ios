name: Isolated H5 multipage reference recovery
on:
  push:
    branches: ['h5-reference-*']
permissions:
  contents: read
jobs:
  visual-multipage:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated reference tooling
        working-directory: scripts/h5-multipage
        run: npm ci
      - name: Capture real H5 routes with synthetic read APIs
        working-directory: scripts/h5-multipage
        env:
          FIXTURE_PATH: ../../App/Resources/TimelineParity.json
        run: npm run capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h5-multipage-reference-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: scripts/h5-multipage/artifacts/
          if-no-files-found: error
          retention-days: 14
