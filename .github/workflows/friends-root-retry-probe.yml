name: Friends root retry evidence (optional)
'on':
  push:
    branches: ['ui-four-tabs-148-20261112']
permissions:
  contents: read
jobs:
  friends-root-retry:
    if: github.repository == 'qianshou330-cyber/pubo-ios' && github.ref == 'refs/heads/ui-four-tabs-148-20261112' && contains(github.event.head_commit.message, '[friends-root-retry-probe]')
    runs-on: macos-15-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PUBO_SIM_SIZE: ${{ matrix.size }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile Debug and run only the cursor retry XCTest
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = x86_64
          test "$(xcodebuild -version)" = "$(printf 'Xcode 26.0.1\nBuild version 17A400')"
          private="$(mktemp -d "$RUNNER_TEMP/friends-retry.XXXXXX")"
          python3 scripts/friends-root-retry-probe.py "$private" "build/friends-root-retry-$PUBO_SIM_SIZE"
      - name: Upload only bound synthetic evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostic-friends-root-retry-${{ matrix.size }}-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            build/friends-root-retry-${{ matrix.size }}/receipt.json
            build/friends-root-retry-${{ matrix.size }}/friends-root-retry-existing-cursor.png
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7
