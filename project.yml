name: PUBO
options:
  bundleIdPrefix: com.bolubo
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  PUBOCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  PUBO:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: PUBOCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bolubo.native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PUBO
        CFBundleDevelopmentRegion: zh_CN
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 拍摄照片或视频，用于发帖和私信。
        NSMicrophoneUsageDescription: 录制你主动发送的私信语音。
        NSPhotoLibraryAddUsageDescription: 将你选择的图片保存到相册。
        CFBundleURLTypes:
          - CFBundleURLName: com.bolubo.native.auth
            CFBundleURLSchemes: [pubonative]
  PUBOUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PUBO
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PUBO:
    build:
      targets:
        PUBO: all
    test:
      targets: [PUBOUITests]
