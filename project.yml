name: PUBO
options:
  bundleIdPrefix: com.bolubo
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  PUBOCore:
    path: .
  SDWebImage:
    url: https://github.com/SDWebImage/SDWebImage.git
    revision: 2de3a496eaf6df9a1312862adcfd54acd73c39c0
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: 0.9.1
    CURRENT_PROJECT_VERSION: 106
targets:
  PUBO:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: PUBOCore
      - package: SDWebImage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bolubo.native
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: 0.9.1
        CURRENT_PROJECT_VERSION: 106
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/PUBO.entitlements
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PUBO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh_CN
        PUBOAPNSEnvironment: $(APNS_ENVIRONMENT)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 拍摄照片或视频，用于发帖和私信。
        NSMicrophoneUsageDescription: 录制你主动发送的私信语音。
        NSPhotoLibraryAddUsageDescription: 将你选择的图片保存到相册。
        CFBundleURLTypes:
          - CFBundleURLName: com.bolubo.native.auth
            CFBundleURLSchemes: [pubonative]
  PUBOUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PUBO
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1'
schemes:
  PUBO:
    build:
      targets:
        PUBO: all
    test:
      targets: [PUBOUITests]



